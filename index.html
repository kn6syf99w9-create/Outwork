<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Outwork" />
    <title>Outwork</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #f1f5f2;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #app:empty::before {
        content: "Outwork wird geladen...";
        min-height: 100svh;
        display: grid;
        place-items: center;
        color: #8d969f;
      }
    </style>
    <script>
      if (!location.pathname.endsWith("/") && !location.pathname.split("/").pop().includes(".")) {
        location.replace(`${location.pathname}/${location.search}${location.hash}`);
      }
    </script>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=3" />
  </head>
  <body>
    <div id="app" class="app-shell"></div>
    <script src="./app.js?v=3" type="module"></script>
  </body>
</html>
